apiVersion: apps/v1
kind: Deployment
metadata:
  name: elearning-deployment
  labels:
    app: elearning

spec:
  replicas: 3
  
  selector:
    matchLabels:
      app: elearningnew

  template:
    metadata:
      labels:
        app: elearning

    spec:
      containers:
      - name: elearning
        image: smartcloud2022/elearning:v1
        ports:
        - containerPort: 80

